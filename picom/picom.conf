#################################
#  picom — compositor-configuratie
#  Locatie: ~/.config/picom/picom.conf
#################################

# --- Backend / weergave ---------------------------------------
# 'glx' geeft de mooiste resultaten (o.a. blur). Draait het traag of
# werkt het niet in je virtuele machine? Vervang dan door "xrender"
# en zet hieronder blur-background op false.
backend = "glx";
vsync = true;
unredir-if-possible = true;   # schakel compositing uit bij fullscreen (video/games)

log-level = "warn";

# --- Schaduwen -------------------------------------------------
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'slop'",
    "class_g = 'Rofi'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@",
    "window_type = 'dock'",
    "window_type = 'desktop'",
];

# --- Fading ----------------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

# --- Transparantie / opacity -----------------------------------
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
    "95:class_g = 'Alacritty' && !focused",
    "100:fullscreen",
];

# --- Afgeronde hoeken ------------------------------------------
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Rofi'",
];

# --- Blur (alleen met de glx-backend) --------------------------
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'Rofi'",
];

# --- Venstertypes / detectie -----------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

wintypes:
{
    tooltip       = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
    dock          = { shadow = false; clip-shadow-above = true; };
    dnd           = { shadow = false; };
    popup_menu    = { opacity = 0.98; };
    dropdown_menu = { opacity = 0.98; };
    normal        = { };
};
